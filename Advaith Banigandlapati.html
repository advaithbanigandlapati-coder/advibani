<style>
  /* Single dark look: full-bleed space footage, white type, liquid-glass chrome.
     Headlines: Bodoni Moda italic (high-contrast editorial serif). Body: Barlow. */
  :root {
    --space: #000000;
    --ink: #ffffff;
    --star: 255, 255, 255;
    --display-family: 'Bodoni Moda', 'Didot', 'Bodoni 72', Georgia, serif;
    --display-weight: 500;
    --display-style: italic;
    --display-transform: none;
    --display-tracking: -0.025em;
    color-scheme: dark;
  }
  html, body { background: var(--space); color: var(--ink); }
  body { font-family: 'Barlow', ui-sans-serif, system-ui, sans-serif; overflow-x: hidden; }

  .font-heading {
    font-weight: var(--display-weight);
    font-style: var(--display-style);
    text-transform: var(--display-transform);
    letter-spacing: var(--display-tracking);
    overflow-wrap: anywhere;
  }

  .liquid-glass {
    background: rgba(255,255,255,0.01);
    background-blend-mode: luminosity;
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    border: none;
    box-shadow: inset 0 1px 1px rgba(255,255,255,0.1);
    position: relative;
    overflow: hidden;
  }
  .liquid-glass::before {
    content: "";
    position: absolute; inset: 0;
    border-radius: inherit;
    padding: 1.4px;
    background: linear-gradient(180deg,
      rgba(255,255,255,0.45) 0%,
      rgba(255,255,255,0.15) 20%,
      rgba(255,255,255,0) 40%,
      rgba(255,255,255,0) 60%,
      rgba(255,255,255,0.15) 80%,
      rgba(255,255,255,0.45) 100%);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
  }
  .liquid-glass-strong {
    background: rgba(255,255,255,0.01);
    background-blend-mode: luminosity;
    backdrop-filter: blur(50px);
    -webkit-backdrop-filter: blur(50px);
    border: none;
    box-shadow: 4px 4px 4px rgba(0,0,0,0.05), inset 0 1px 1px rgba(255,255,255,0.15);
    position: relative;
    overflow: hidden;
  }
  .liquid-glass-strong::before {
    content: "";
    position: absolute; inset: 0;
    border-radius: inherit;
    padding: 1.4px;
    background: linear-gradient(180deg,
      rgba(255,255,255,0.5) 0%,
      rgba(255,255,255,0.2) 20%,
      rgba(255,255,255,0) 40%,
      rgba(255,255,255,0) 60%,
      rgba(255,255,255,0.2) 80%,
      rgba(255,255,255,0.5) 100%);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
  }

  /* ---- Vine scrollbar (desktop / mouse only) ---- */
  :root {
    --moss: #8fb57a;
    --leaf-light: #b9d8a0;
    --leaf-vein: #34502b;
    --petal: #fff4e8;
    --ember: #e8702a;
  }
  html.vine-on { scrollbar-width: none; }
  html.vine-on::-webkit-scrollbar { display: none; }
  html.vine-dragging, html.vine-dragging * { user-select: none; cursor: grabbing !important; }

  #vine-scroll {
    position: fixed;
    top: 0;
    right: calc(4px + env(safe-area-inset-right, 0px));
    width: 24px;
    height: 100vh;
    z-index: 300;
    opacity: 0.55;
    cursor: pointer;
    transition: opacity .35s ease;
  }
  #vine-scroll.active, #vine-scroll:hover { opacity: 1; }
  #vine-scroll svg { display: block; overflow: visible; }

  .vine-base  { fill: none; stroke: rgba(255,255,255,0.14); stroke-width: 1.2; stroke-linecap: round; }
  .vine-grown { fill: none; stroke: var(--moss); stroke-width: 1.7; stroke-linecap: round; }
  .leaf-body {
    fill: var(--moss);
    transform: scale(0);
    transition: transform .5s cubic-bezier(.34,1.56,.64,1);
  }
  .leaf-body.on { transform: scale(1); }
  .leaf-body.alt { fill: var(--leaf-light); }

  .vine-thumb { cursor: grab; filter: drop-shadow(0 0 4px rgba(185,216,160,.55)); }
  .thumb-inner { transition: transform .25s cubic-bezier(.34,1.56,.64,1); }
  #vine-scroll:hover .thumb-inner, html.vine-dragging .thumb-inner { transform: scale(1.25); }
  .thumb-body  { fill: var(--leaf-light); }
  .thumb-rib   { fill: none; stroke: var(--leaf-vein); stroke-width: .9; stroke-linecap: round; }
  .thumb-veins { fill: none; stroke: var(--leaf-vein); stroke-width: .6; stroke-linecap: round; opacity: .75; }

  .flower-inner {
    transform: scale(0) rotate(-120deg);
    transition: transform .8s cubic-bezier(.34,1.56,.64,1);
  }
  .vine-flower.on .flower-inner { transform: scale(1) rotate(0deg); }
  .petal { fill: var(--petal); }
  .flower-core { fill: var(--ember); }

  @media (prefers-reduced-motion: reduce) {
    .leaf-body, .flower-inner, .thumb-inner { transition: none; }
  }

  /* Lenis smooth scroll */
  html.lenis, html.lenis body { height: auto; }
  .lenis.lenis-smooth [data-lenis-prevent] { overscroll-behavior: contain; }
  .lenis.lenis-stopped { overflow: clip; }
  .lenis.lenis-smooth iframe { pointer-events: none; }

  /* Quality tiers set by the performance governor */
  #capabilities, #wins, #contact { contain: paint; }
  :root[data-perf="medium"] .liquid-glass-strong {
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
  }
  :root[data-perf="low"] .liquid-glass,
  :root[data-perf="low"] .liquid-glass-strong {
    backdrop-filter: none;
    -webkit-backdrop-filter: none;
    background: rgba(255,255,255,0.07);
  }
  :root[data-perf="low"] .hero-zoom { animation: none; }

  a:focus-visible, button:focus-visible {
    outline: 2px solid var(--ink);
    outline-offset: 3px;
  }

  /* Ken Burns zoom on the magma image */
  @keyframes heroZoom { 0%{transform:scale(1.12)} 100%{transform:scale(1)} }
  .hero-zoom { animation:heroZoom 1.8s cubic-bezier(0.16,1,0.3,1) forwards; }
  @media (prefers-reduced-motion: reduce){ .hero-zoom{ animation:none; } }
</style>

<!-- Lenis: eased, buttery scrolling (skipped for people who ask for reduced motion) -->
<script src="https://unpkg.com/lenis@1.1.20/dist/lenis.min.js" integrity="sha384-eD5ubmuCcvTdCADWuSchJYE7wcj2nzNr0itbrh6w/KJyBiltSZ8w3VFRBSWu5YQ8" crossorigin="anonymous"></script>
<script>
  (function () {
    if (!window.Lenis || window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    var lenis = new Lenis({ autoRaf: true, lerp: 0.09, smoothWheel: true });
    window.lenis = lenis;
    // In-page links (#ventures, #contact…) glide instead of jumping.
    document.addEventListener("click", function (e) {
      var a = e.target.closest && e.target.closest('a[href^="#"]');
      if (!a) return;
      var id = a.getAttribute("href");
      if (!id || id.length < 2) return;
      var el = document.querySelector(id);
      if (!el) return;
      e.preventDefault();
      lenis.scrollTo(el, { duration: 1.4 });
    });
  })();
</script>

<script>
  /* Performance governor.
     Watches real frame times and steps the page between three quality tiers:
       high   – everything on
       medium – twinkling starfields freeze, heavy glass blur is lightened
       low    – glass blur off, Ken Burns zoom off
     It only ever removes decoration; video speed and content never change.
     Steps down after ~1.5s of sustained lag, steps back up after a long stretch of smooth frames,
     and waits longer before each retry so it can't flicker between tiers. */
  (function () {
    var root = document.documentElement;
    var TIERS = ["high", "medium", "low"];
    var tier = 0;
    var nav = navigator;
    if ((nav.connection && nav.connection.saveData) ||
        (nav.deviceMemory && nav.deviceMemory <= 4) ||
        (nav.hardwareConcurrency && nav.hardwareConcurrency <= 4)) tier = 1;

    function set(t) {
      tier = Math.max(0, Math.min(2, t));
      root.setAttribute("data-perf", TIERS[tier]);
      window.dispatchEvent(new CustomEvent("perfchange", { detail: TIERS[tier] }));
    }
    set(tier);

    var last = performance.now();
    var samples = [];
    var badSince = 0, goodSince = 0;
    var settleUntil = last + 3000;     // ignore page-load jank
    var upgradeWait = 8000;            // doubles after every downgrade

    function reset(now, settle) { samples = []; badSince = 0; goodSince = 0; settleUntil = now + settle; }

    function tick(now) {
      var dt = now - last; last = now;
      if (document.visibilityState === "visible" && dt < 500) {
        samples.push(dt);
        if (samples.length > 60) samples.shift();
      }
      if (now > settleUntil && samples.length >= 30) {
        var sum = 0; for (var i = 0; i < samples.length; i++) sum += samples[i];
        var fps = 1000 / (sum / samples.length);
        if (fps < 45) {
          goodSince = 0;
          if (!badSince) badSince = now;
          if (now - badSince > 1500 && tier < 2) { set(tier + 1); upgradeWait *= 2; reset(now, 2500); }
        } else if (fps > 56) {
          badSince = 0;
          if (!goodSince) goodSince = now;
          if (now - goodSince > upgradeWait && tier > 0) { set(tier - 1); reset(now, 2500); }
        } else {
          badSince = 0; goodSince = 0;
        }
      }
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);

    document.addEventListener("visibilitychange", function () {
      last = performance.now(); reset(last, 1500);
    });
  })();
</script>

<!-- Starfield: sits under each video so the section reads as space while the footage loads (or if it can't). -->
<script type="text/babel" data-presets="react">
  function Starfield({ density = 0.00018 }) {
    const ref = React.useRef(null);
    React.useEffect(() => {
      const canvas = ref.current;
      const ctx = canvas.getContext("2d");
      const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      let stars = [];
      let raf = 0;
      let w = 0, h = 0, dpr = 1;

      const resize = () => {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        w = canvas.clientWidth; h = canvas.clientHeight;
        canvas.width = w * dpr; canvas.height = h * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        const n = Math.round(w * h * density);
        stars = Array.from({ length: n }, () => ({
          x: Math.random() * w,
          y: Math.random() * h,
          r: Math.random() * 1.1 + 0.2,
          a: Math.random() * 0.6 + 0.2,
          tw: Math.random() * Math.PI * 2,
          v: Math.random() * 0.06 + 0.01,
        }));
      };

      const draw = (t) => {
        ctx.clearRect(0, 0, w, h);
        for (const s of stars) {
          const alpha = reduce ? s.a : s.a * (0.65 + 0.35 * Math.sin(t / 900 + s.tw));
          ctx.fillStyle = `rgba(255,255,255,${alpha})`;
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
          ctx.fill();
          if (!reduce) {
            s.y += s.v;
            if (s.y > h) { s.y = 0; s.x = Math.random() * w; }
          }
        }
        if (canAnimate()) raf = requestAnimationFrame(draw);
      };

      // Animate only while on screen and while the device keeps up (see the performance governor);
      // otherwise hold a still frame.
      let visible = false;
      const canAnimate = () => !reduce && visible && document.documentElement.getAttribute("data-perf") === "high";
      const restart = () => { cancelAnimationFrame(raf); if (canAnimate()) raf = requestAnimationFrame(draw); };
      const io = new IntersectionObserver(([e]) => { visible = e.isIntersecting; restart(); });
      io.observe(canvas);
      window.addEventListener("perfchange", restart);

      const onResize = () => { resize(); restart(); if (!canAnimate()) draw(performance.now()); };
      resize();
      draw(0);
      window.addEventListener("resize", onResize);
      return () => {
        cancelAnimationFrame(raf);
        io.disconnect();
        window.removeEventListener("perfchange", restart);
        window.removeEventListener("resize", onResize);
      };
    }, [density]);

    return <canvas ref={ref} aria-hidden="true" className="absolute inset-0 w-full h-full z-0 pointer-events-none" />;
  }
  window.Starfield = Starfield;
</script>

<!-- FadingVideo: rAF-driven crossfade, manual looping via `ended` -->
<script type="text/babel" data-presets="react">
  const FADE_MS = 500;
  const FADE_OUT_LEAD = 0.55;
  // 1 = original speed. Lower is slower (0.6 = 60% speed).
  const VIDEO_RATE = 0.8;

  function FadingVideo({ src, className, style }) {
    const videoRef = React.useRef(null);
    const rafRef = React.useRef(0);
    const fadingOutRef = React.useRef(false);
    const timeoutRef = React.useRef(0);

    React.useEffect(() => {
      const video = videoRef.current;
      if (!video) return;

      const fadeTo = (target, duration = FADE_MS) => {
        cancelAnimationFrame(rafRef.current);
        const from = parseFloat(video.style.opacity);
        const start = Number.isFinite(from) ? from : 0;
        const t0 = performance.now();
        const step = (now) => {
          const p = Math.min(1, (now - t0) / duration);
          video.style.opacity = String(start + (target - start) * p);
          if (p < 1) rafRef.current = requestAnimationFrame(step);
        };
        rafRef.current = requestAnimationFrame(step);
      };

      // Off-screen videos are paused so they don't compete with the one you're watching.
      let onScreen = true;
      // Playback speed: set both values so browsers that reset the rate on load keep it.
      const applyRate = () => { video.defaultPlaybackRate = VIDEO_RATE; video.playbackRate = VIDEO_RATE; };
      applyRate();
      const play = () => { applyRate(); const p = video.play(); if (p && p.catch) p.catch(() => {}); };

      const onLoaded = () => {
        applyRate();
        video.style.opacity = "0";
        if (onScreen) play();
        fadeTo(1);
      };

      const onTime = () => {
        const d = video.duration;
        // remaining time in real seconds, so the fade-out still lands right at the slower speed
        const left = (d - video.currentTime) / (video.playbackRate || 1);
        if (!fadingOutRef.current && left <= FADE_OUT_LEAD && left > 0) {
          fadingOutRef.current = true;
          fadeTo(0);
        }
      };

      const onEnded = () => {
        cancelAnimationFrame(rafRef.current);
        video.style.opacity = "0";
        timeoutRef.current = setTimeout(() => {
          video.currentTime = 0;
          if (onScreen) play();
          fadingOutRef.current = false;
          fadeTo(1);
        }, 100);
      };

      const io = new IntersectionObserver(([e]) => {
        onScreen = e.isIntersecting;
        if (onScreen) { if (video.readyState >= 2 && video.paused && !video.ended) play(); }
        else if (!video.paused) video.pause();
      }, { rootMargin: "150px 0px" });
      io.observe(video);

      video.addEventListener("loadeddata", onLoaded);
      video.addEventListener("timeupdate", onTime);
      video.addEventListener("ended", onEnded);
      if (video.readyState >= 2) onLoaded();

      return () => {
        cancelAnimationFrame(rafRef.current);
        clearTimeout(timeoutRef.current);
        io.disconnect();
        video.removeEventListener("loadeddata", onLoaded);
        video.removeEventListener("timeupdate", onTime);
        video.removeEventListener("ended", onEnded);
      };
    }, [src]);

<!-- BlurText: word-by-word blur-in -->
<script type="text/babel" data-presets="react">
  function BlurText({ text, className = "", delay = 100, as: Tag = "p" }) {
    const { motion } = window.Motion;
    const ref = React.useRef(null);
    const [inView, setInView] = React.useState(false);

    React.useEffect(() => {
      const el = ref.current;
      if (!el) return;
      const io = new IntersectionObserver(
        ([entry]) => {
          if (entry.isIntersecting) { setInView(true); io.disconnect(); }
        },
        { threshold: 0.1 }
      );
      io.observe(el);
      return () => io.disconnect();
    }, []);

    const words = text.split(" ");
    const stepDuration = 0.35;
    const MotionTag = motion[Tag] ? Tag : "p";

    return (
      <MotionTag
        ref={ref}
        className={className}
        style={{ display: "flex", flexWrap: "wrap", justifyContent: "center", rowGap: "0.1em" }}
        aria-label={text}
      >
        {words.map((word, i) => (
          <motion.span
            key={`${word}-${i}`}
            aria-hidden="true"
            style={{ display: "inline-block", marginRight: "0.28em", willChange: "transform, filter, opacity" }}
            initial={{ filter: "blur(10px)", opacity: 0, y: 50 }}
            animate={
              inView
                ? {
                    filter: ["blur(10px)", "blur(5px)", "blur(0px)"],
                    opacity: [0, 0.5, 1],
                    y: [50, -5, 0],
                  }
                : { filter: "blur(10px)", opacity: 0, y: 50 }
            }
            transition={{
              duration: stepDuration * 2,
              times: [0, 0.5, 1],
              ease: "easeOut",
              delay: (i * delay) / 1000,
            }}
          >
            {word}
          </motion.span>
        ))}
      </MotionTag>
    );
  }
  window.BlurText = BlurText;
</script>

<script type="text/babel" data-presets="react">
  const BG_IMAGE_1 = "https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260609_195923_b0ba8ace-1d1d-4f2c-9a28-1ab84b330680.png&w=1280&q=85";
  const BG_IMAGE_2 = "https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260609_201152_bba90a12-bf12-459f-91f0-51f237dbaf3b.png&w=1280&q=85";
  const SPOTLIGHT_R = 260;

  function Contact() {
    const { copy } = useCopy();
    const sectionRef = React.useRef(null);
    const revealRef = React.useRef(null);

    // Smoothed cursor → soft circular mask. Written straight to the element, no React re-render per frame.
    React.useEffect(() => {
      const section = sectionRef.current;
      const reveal = revealRef.current;
      const mouse = { x: -999, y: -999 };
      const smooth = { x: -999, y: -999 };
      let raf = 0;
      const setMask = (x, y) => {
        const m = `radial-gradient(circle ${SPOTLIGHT_R}px at ${x.toFixed(1)}px ${y.toFixed(1)}px, rgba(255,255,255,1) 0%, rgba(255,255,255,1) 40%, rgba(255,255,255,0.75) 60%, rgba(255,255,255,0.4) 75%, rgba(255,255,255,0.12) 88%, rgba(255,255,255,0) 100%)`;
        reveal.style.maskImage = m;
        reveal.style.webkitMaskImage = m;
      };
      setMask(-999, -999);
      const toLocal = (cx, cy) => {
        const r = section.getBoundingClientRect();
        mouse.x = cx - r.left; mouse.y = cy - r.top;
      };
      const onMove = (e) => toLocal(e.clientX, e.clientY);
      const onTouch = (e) => { const t = e.touches[0]; if (t) toLocal(t.clientX, t.clientY); };
      let lastX = -99999, lastY = -99999;
      const loop = () => {
        if (smooth.x === -999 && mouse.x !== -999) { smooth.x = mouse.x; smooth.y = mouse.y; }
        smooth.x += (mouse.x - smooth.x) * 0.1;
        smooth.y += (mouse.y - smooth.y) * 0.1;
        const r = section.getBoundingClientRect();
        if (r.bottom > 0 && r.top < window.innerHeight && (Math.abs(smooth.x - lastX) > 0.3 || Math.abs(smooth.y - lastY) > 0.3)) {
          setMask(smooth.x, smooth.y);
          lastX = smooth.x; lastY = smooth.y;
        }
        raf = requestAnimationFrame(loop);
      };
      window.addEventListener("mousemove", onMove);
      section.addEventListener("touchstart", onTouch, { passive: true });
      section.addEventListener("touchmove", onTouch, { passive: true });
      raf = requestAnimationFrame(loop);
      return () => {
        cancelAnimationFrame(raf);
        window.removeEventListener("mousemove", onMove);
        section.removeEventListener("touchstart", onTouch);
        section.removeEventListener("touchmove", onTouch);
      };
    }, []);

    return (
      <section id="contact" ref={sectionRef} className="relative w-full overflow-hidden bg-black" style={{ minHeight: "100dvh" }}>
        <div className="hero-zoom absolute inset-0 bg-center bg-cover bg-no-repeat z-10" style={{ backgroundImage: `url("${BG_IMAGE_1}")` }} />
        <div ref={revealRef} className="absolute inset-0 bg-center bg-cover bg-no-repeat z-30 pointer-events-none" style={{ backgroundImage: `url("${BG_IMAGE_2}")` }} />

        <div className="relative z-50 px-8 md:px-16 lg:px-20 pt-28 pb-10 flex flex-col justify-between gap-16" style={{ minHeight: "100dvh" }}>
          <div>
            <T k="contact.kicker" as="p" className="text-sm font-body text-white/80 mb-6" />
            <h2 className="font-heading text-white text-6xl md:text-8xl lg:text-[8rem] leading-[0.88]">
              <T k="contact.title" />
            </h2>
            <T k="contact.sub" as="p" className="mt-6 text-sm md:text-base text-white/90 font-body font-light leading-snug max-w-[44ch]" />
            <div className="flex flex-wrap items-center gap-6 mt-8">
              <a
                href={LINKEDIN}
                target="_blank"
                rel="noopener"
                className="liquid-glass-strong rounded-full px-5 py-2.5 text-sm font-medium text-white font-body inline-flex items-center gap-2"
              >
                <T k="contact.cta" />
                <ArrowUpRight className="h-5 w-5" />
              </a>
              <a href={"mailto:" + (copy["contact.email"] || EMAIL)} className="text-sm font-medium text-white font-body select-all break-all hover:text-white/80 transition-colors">
                <T k="contact.email" />
              </a>
              <a href={GITHUB} target="_blank" rel="noopener" className="text-sm font-medium text-white font-body inline-flex items-center gap-2 hover:text-white/80 transition-colors">
                <T k="contact.github" />
                <ArrowUpRight className="h-4 w-4" />
              </a>
            </div>
          </div>

          <div>
            <ul className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4" aria-label="Current roles">
              {[1, 2, 3, 4].map((n) => (
                <li key={n} className="liquid-glass-strong rounded-[1.25rem] p-5 text-white">
                  <T k={"role." + n + ".title"} as="div" className="font-heading text-2xl leading-tight" />
                  <T k={"role." + n + ".org"} as="div" className="text-xs font-body font-light text-white/90 mt-2" />
                </li>
              ))}
            </ul>
            <footer className="mt-10 pt-6 border-t border-white/20 flex flex-wrap justify-between gap-3 text-xs font-body text-white/80">
              <T k="footer.left" />
              <T k="footer.right" />
            </footer>
          </div>
        </div>
      </section>
    );
  }
  window.Contact = Contact;
</script>

<!-- Vine scrollbar: grows with scroll, leaves sprout as you pass them, leaf thumb drags, flower blooms at the end -->
<script>
  (function () {
    if (!window.matchMedia("(pointer: fine)").matches) return; // phones keep their native overlay scrollbar
    var NS = "http://www.w3.org/2000/svg";
    var docEl = document.documentElement;
    docEl.classList.add("vine-on");

    var wrap = document.createElement("div");
    wrap.id = "vine-scroll";
    wrap.setAttribute("aria-hidden", "true");
    var svg = document.createElementNS(NS, "svg");
    wrap.appendChild(svg);
    document.body.appendChild(wrap);

    var W = 24, X = 12, AMP = 3.2, WAVE = 140, PAD = 18;
    var H = 0, len = 0, leaves = [], grown, thumb, flower;
    var progress = 0, lastY = window.scrollY, vel = 0, sway = 0, raf = 0, idleT = 0, dragging = false;

    function el(tag, attrs, parent) {
      var n = document.createElementNS(NS, tag);
      for (var k in attrs) n.setAttribute(k, attrs[k]);
      (parent || svg).appendChild(n);
      return n;
    }
    function xAt(y) { return X + AMP * Math.sin((y / WAVE) * Math.PI * 2); }
    function slopeDeg(y) { return Math.atan(AMP * (2 * Math.PI / WAVE) * Math.cos((y / WAVE) * Math.PI * 2)) * 180 / Math.PI; }
    function maxScroll() { return Math.max(1, docEl.scrollHeight - window.innerHeight); }
    function yFor(p) { return PAD + p * (H - 2 * PAD); }

    function build() {
      H = window.innerHeight;
      while (svg.firstChild) svg.removeChild(svg.firstChild);
      svg.setAttribute("width", W);
      svg.setAttribute("height", H);
      svg.setAttribute("viewBox", "0 0 " + W + " " + H);

      el("rect", { x: 0, y: 0, width: W, height: H, fill: "transparent", "data-track": "1" });

      var d = "M " + xAt(PAD).toFixed(2) + " " + PAD;
      for (var y = PAD + 4; y <= H - PAD; y += 4) d += " L " + xAt(y).toFixed(2) + " " + y;
      el("path", { d: d, "class": "vine-base" });
      grown = el("path", { d: d, "class": "vine-grown" });
      len = grown.getTotalLength();
      grown.style.strokeDasharray = len;

      leaves = [];
      var side = 1, i = 0;
      for (var ly = PAD + 46; ly < H - PAD - 30; ly += 58) {
        var g = el("g", { transform: "translate(" + xAt(ly).toFixed(2) + " " + ly + ") rotate(" + (side > 0 ? -35 : 215) + ")" });
        var body = el("path", { d: "M0 0 C3 -3.6 8 -3.6 10 0 C8 3.6 3 3.6 0 0 Z", "class": "leaf-body" + (i % 3 === 1 ? " alt" : "") }, g);
        leaves.push({ y: ly, body: body });
        side *= -1; i++;
      }

      flower = el("g", { "class": "vine-flower", transform: "translate(" + xAt(H - PAD).toFixed(2) + " " + (H - PAD) + ")" });
      var fi = el("g", { "class": "flower-inner" }, flower);
      for (var p = 0; p < 5; p++) el("ellipse", { cx: 0, cy: -4.2, rx: 2.3, ry: 3.6, transform: "rotate(" + p * 72 + ")", "class": "petal" }, fi);
      el("circle", { cx: 0, cy: 0, r: 1.9, "class": "flower-core" }, fi);

      thumb = el("g", { "class": "vine-thumb", "data-thumb": "1" });
      var ti = el("g", { "class": "thumb-inner" }, thumb);
      el("path", { d: "M-10 0 C-6 -7 6 -7 10 0 C6 7 -6 7 -10 0 Z", "class": "thumb-body" }, ti);
      el("path", { d: "M-10 0 L10 0", "class": "thumb-rib" }, ti);
      el("path", { d: "M-3 0 L1 -3.5 M2 0 L5 -3 M-3 0 L1 3.5 M2 0 L5 3", "class": "thumb-veins" }, ti);

      progress = Math.min(1, Math.max(0, window.scrollY / maxScroll()));
      render();
    }

    function render() {
      var y = yFor(progress);
      grown.style.strokeDashoffset = (len * (1 - progress)).toFixed(1);
      for (var i = 0; i < leaves.length; i++) leaves[i].body.classList.toggle("on", leaves[i].y <= y + 2);
      flower.classList.toggle("on", progress > 0.985);
      var rot = 90 - slopeDeg(y) + sway;
      thumb.setAttribute("transform", "translate(" + xAt(y).toFixed(2) + " " + y.toFixed(2) + ") rotate(" + rot.toFixed(2) + ")");
    }

    function loop() {
      var sy = window.scrollY;
      vel = sy - lastY; lastY = sy;
      progress = Math.min(1, Math.max(0, sy / maxScroll()));
      var target = Math.max(-28, Math.min(28, vel * 0.5)); // leaf sways with scroll speed
      sway += (target - sway) * 0.12;
      render();
      if (Math.abs(sway) > 0.05 || Math.abs(vel) > 0.1) raf = requestAnimationFrame(loop);
      else raf = 0;
    }

    function wake() {
      wrap.classList.add("active");
      clearTimeout(idleT);
      idleT = setTimeout(function () { if (!dragging) wrap.classList.remove("active"); }, 1400);
      if (!raf) raf = requestAnimationFrame(loop);
    }

    function scrollToProgress(p, immediate) {
      var target = Math.min(1, Math.max(0, p)) * maxScroll();
      if (window.lenis) window.lenis.scrollTo(target, immediate ? { immediate: true } : { duration: 1.2 });
      else window.scrollTo({ top: target, behavior: immediate ? "auto" : "smooth" });
    }
    function pFromEvent(e) { return (e.clientY - PAD) / (H - 2 * PAD); }

    wrap.addEventListener("pointerdown", function (e) {
      if (e.button !== 0) return;
      e.preventDefault();
      var onThumb = e.target.closest && e.target.closest("[data-thumb]");
      if (onThumb) {
        dragging = true;
        docEl.classList.add("vine-dragging");
        wrap.setPointerCapture(e.pointerId);
      } else {
        scrollToProgress(pFromEvent(e), false);
      }
      wake();
    });
    wrap.addEventListener("pointermove", function (e) {
      if (!dragging) return;
      scrollToProgress(pFromEvent(e), true);
      wake();
    });
    function endDrag(e) {
      if (!dragging) return;
      dragging = false;
      docEl.classList.remove("vine-dragging");
      try { wrap.releasePointerCapture(e.pointerId); } catch (err) {}
      wake();
    }
    wrap.addEventListener("pointerup", endDrag);
    wrap.addEventListener("pointercancel", endDrag);

    window.addEventListener("scroll", wake, { passive: true });
    var rT = 0;
    window.addEventListener("resize", function () { clearTimeout(rT); rT = setTimeout(build, 100); });
    if (window.ResizeObserver) new ResizeObserver(function () { if (!raf) raf = requestAnimationFrame(loop); }).observe(document.body);

    build();
  })();
</script>
